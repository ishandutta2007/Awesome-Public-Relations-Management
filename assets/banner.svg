<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pulse-circle {
      animation: pulse 3s infinite alternate;
    }
    .wave-line {
      stroke-dasharray: 10 15;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0% { r: 6px; opacity: 0.4; }
      100% { r: 14px; opacity: 0.9; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Decorative Waves & Nodes -->
  <path class="wave-line" d="M 50,220 Q 300,100 600,200 T 1150,140" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6" />
  <path class="wave-line" d="M 50,250 Q 350,150 700,230 T 1150,100" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <circle cx="300" cy="150" r="10" fill="#38bdf8" class="pulse-circle" filter="url(#glow)" />
  <circle cx="600" cy="200" r="8" fill="#818cf8" class="pulse-circle" filter="url(#glow)" />
  <circle cx="850" cy="120" r="12" fill="#c084fc" class="pulse-circle" filter="url(#glow)" />

  <!-- Content Group -->
  <g transform="translate(60, 110)">
    <!-- Icon/Logo Graphic -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="2" />
      <path d="M 20,45 L 32,22 L 50,45 M 26,38 L 44,38" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="50" cy="22" r="4" fill="#c084fc" />
    </g>

    <!-- Text -->
    <text x="95" y="42" class="title" filter="url(#glow)">Awesome Public Relations Management</text>
    <text x="95" y="75" class="subtitle">Curated SaaS Platforms, Media Databases &amp; Open-Source PR Tools Ecosystem 📣</text>
  </g>
</svg>
